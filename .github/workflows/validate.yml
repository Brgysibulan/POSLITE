name: Validate SariPOS Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scanner.js
          node --check no-barcode.js
          node --check receipt.js
          node --check cash-loans.js
          node --check preferences.js
          node --check brand.js
          node --check about.js
          node --check sw.js
          node --check admin/admin.js
      - name: Verify required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f scanner.css
          test -f receipt.css
          test -f cash-loans.css
          test -f preferences.css
          test -f app.js
          test -f scanner.js
          test -f no-barcode.js
          test -f receipt.js
          test -f cash-loans.js
          test -f preferences.js
          test -f brand.js
          test -f about.js
          test -f data/receipts.json
          test -f manifest.webmanifest
          test -f sw.js
          test -f docs/PROJECT.md
          test -f docs/BARCODE-SCANNER.md
          test -f docs/NO-BARCODE-PRODUCTS.md
          test -f docs/RECEIPTS.md
          test -f docs/CASH-LOANS.md
          test -f docs/CUSTOMIZATION.md
          test -f docs/BACKUP-RESTORE.md
          test -f docs/CLOUD-AUTH-LICENSING.md
          test -f docs/TRANSACTION-LIFECYCLE.md
          test -f docs/CASH-CLOSING.md
          test -f docs/PATCH-NOTES.md
          test -f CHANGELOG.md
          test -f admin/index.html
          test -f admin/admin.css
          test -f admin/admin.js
          test -f supabase/config.toml
          test -f supabase/migrations/20260908000000_saripos_cloud_foundation.sql
          test -f supabase/functions/license-status/index.ts
          test -f supabase/functions/backups/index.ts
          test -f supabase/functions/admin-license/index.ts
          test -f scripts/generate-license-keys.sh
