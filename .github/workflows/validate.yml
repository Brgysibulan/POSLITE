name: Validate POSlite Web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Verify required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f docs/PROJECT.md
          test -f CHANGELOG.md
